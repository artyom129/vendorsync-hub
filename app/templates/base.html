<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
{% set here = request.url.path %}
<header>
  <a class="brand" href="/">Vendor<i>Sync</i></a>
  <nav>
    <a href="/" {% if here == '/' %}aria-current="page"{% endif %}>Overview</a>
    <a href="/catalog" {% if here == '/catalog' or here.startswith('/products') %}aria-current="page"{% endif %}>Catalog</a>
    <a href="/jobs" {% if here == '/jobs' %}aria-current="page"{% endif %}>Jobs</a>
    <a href="/versions" {% if here == '/versions' %}aria-current="page"{% endif %}>Versions</a>
    <a href="/docs">API</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>feeds in, one catalog out</footer>
</body>
</html>
